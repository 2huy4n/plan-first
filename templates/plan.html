<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · 任务计划</title>
<style>
  :root {
    --ink: #18221d;
    --muted: #627067;
    --paper: #f6f3ec;
    --card: #fffdf8;
    --line: #ded8ca;
    --accent: #216e57;
    --accent-soft: #dcebe2;
    --warn: #9b5b23;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(circle at 8% 4%, rgba(33,110,87,.10), transparent 28rem),
      linear-gradient(180deg, #f2eee3 0, var(--paper) 22rem, #f8f5ee 100%);
    font: 16px/1.7 "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .page { width: min(1040px, calc(100% - 40px)); margin: 0 auto; padding: 54px 0 80px; }
  .hero {
    padding: clamp(26px, 4vw, 48px);
    border: 1px solid var(--line);
    border-radius: 22px;
    background: rgba(255,253,248,.86);
    box-shadow: 0 18px 45px rgba(41,52,43,.08);
  }
  .eyebrow {
    margin: 0 0 12px;
    color: var(--accent);
    font: 700 11px/1.2 "SFMono-Regular", Consolas, monospace;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  h1 {
    max-width: 820px;
    margin: 0;
    font: 800 clamp(30px, 5vw, 54px)/1.14 Georgia, "Songti SC", serif;
    letter-spacing: -.03em;
  }
  .subtitle { margin: 16px 0 0; color: var(--muted); font-size: 17px; }
  .meta { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 24px; color: var(--muted); font: 12px/1.4 "SFMono-Regular", Consolas, monospace; }
  .meta span { padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
  .toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 0; }
  .toc a {
    padding: 7px 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--accent);
    background: var(--card);
    font-size: 13px;
    text-decoration: none;
  }
  .toc a:hover { background: var(--accent-soft); border-color: var(--accent); }
  .blocks { display: grid; gap: 18px; margin-top: 24px; }
  .block {
    display: grid;
    grid-template-columns: 58px minmax(0, 1fr);
    gap: 20px;
    padding: 26px 30px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--card);
    box-shadow: 0 8px 20px rgba(41,52,43,.035);
  }
  .block-head { min-width: 0; }
  .index {
    display: block;
    color: var(--accent);
    font: 700 12px/1 "SFMono-Regular", Consolas, monospace;
    letter-spacing: .08em;
  }
  .block h2 {
    margin: 8px 0 0;
    font: 700 clamp(20px, 2.6vw, 28px)/1.25 Georgia, "Songti SC", serif;
    letter-spacing: -.02em;
  }
  .content { min-width: 0; color: #2b3830; }
  .content p { margin: 0 0 12px; }
  .content p:last-child { margin-bottom: 0; }
  .content h3 { margin: 22px 0 8px; color: var(--accent); font-size: 15px; letter-spacing: .04em; }
  .content h4 { margin: 18px 0 6px; font-size: 14px; }
  .content ul, .content ol { margin: 0 0 12px; padding-left: 22px; }
  .content li { margin: 5px 0; }
  .content li::marker { color: var(--accent); }
  .content strong { color: #123f32; }
  .content code { padding: 1px 5px; border-radius: 5px; background: #eef3ed; color: #175844; font-size: .92em; }
  .content pre { overflow: auto; padding: 14px 16px; border-radius: 10px; background: #1d2922; color: #e8f2ea; }
  .content pre code { padding: 0; background: transparent; color: inherit; font-size: 13px; }
  .content blockquote { margin: 12px 0; padding: 8px 16px; border-left: 3px solid var(--accent); background: #f1f6f0; color: #405148; }
  .content hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
  .table-wrap { overflow-x: auto; margin: 12px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 11px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { background: #edf4ee; color: #244b3b; font-weight: 700; }
  .task { list-style: none; display: flex; gap: 9px; align-items: flex-start; margin-left: -18px; }
  .task .box { color: var(--accent); font-family: "SFMono-Regular", Consolas, monospace; }
  .task.done { color: var(--muted); text-decoration: line-through; }
  .empty { color: var(--muted); font-style: italic; }
  .footer { margin-top: 26px; color: var(--muted); font-size: 12px; text-align: right; }
  @media (max-width: 680px) {
    .page { width: min(100% - 24px, 1040px); padding-top: 24px; }
    .hero { padding: 24px 20px; border-radius: 16px; }
    .block { grid-template-columns: 1fr; gap: 8px; padding: 20px; }
    .block .index { font-size: 11px; }
  }
  @media print {
    @page { margin: 14mm; }
    body { background: #fff; color: #000; font-size: 11pt; }
    .page { width: auto; padding: 0; }
    .hero, .block { border: 1px solid #bbb; box-shadow: none; break-inside: avoid; }
    .toc { display: none; }
    .block { padding: 12pt; margin-bottom: 8pt; }
    a { color: inherit; text-decoration: none; }
  }
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <p class="eyebrow">PLAN / TASK GOAL</p>
    <h1>{{TITLE}}</h1>
    <p class="subtitle">从 project.md 生成的任务计划书 · 只呈现已确认内容</p>
    <div class="meta">
      <span>source: {{SOURCE}}</span>
      <span>generated: {{GENERATED}}</span>
    </div>
    <nav class="toc" aria-label="章节导航">{{NAV}}</nav>
  </header>
  <div class="blocks">{{SECTIONS}}</div>
  <footer class="footer">plan-first · source of truth: project.md</footer>
</main>
</body>
</html>
